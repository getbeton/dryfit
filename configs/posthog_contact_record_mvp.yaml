dataset_id: posthog_contact_record_mvp_v1
seed: 42

backend:
  kind: postgres
  dsn: postgresql:///dryfit

scenario:
  kind: posthog_contact_record

scale:
  accounts: 300
  users_per_account_mean: 4
  sessions_per_user_mean: 7
  duration_days: 30

success:
  event_name: contact_created
  entity_type: account

signals:
  positive:
    - id: import_to_contact_growth
      path: [list_imported, contact_created]
      count: 85
      cohort_filters: [high_intent, medium_intent, power_user]
    - id: enriched_contact_creation
      path: [contact_created, enrichment_completed, contact_created]
      count: 45
      cohort_filters: [high_intent, medium_intent]

  negative:
    - id: import_segment_stall
      path: [list_imported, segment_created]
      count: 60
      cohort_filters: [medium_intent, low_intent, lurker]
    - id: contact_segment_without_growth
      path: [contact_created, segment_created]
      count: 45
      cohort_filters: [low_intent, lurker, noisy_bot_like]

noise:
  missing_event_probability: 0.04
  duplicate_event_probability: 0.02
  out_of_order_probability: 0.03
  null_property_probability: 0.03
  anonymous_actor_probability: 0.01
  weird_property_probability: 0.01

faker:
  locales: [en_US]
  use_company_names: true
  use_emails: true
